<!DOCTYPE html>
<html>
<head>
    <title>Busca Contatos FUST</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #6a00a8;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.2);
        }

        h3 {
            color: #6a00a8;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6a00a8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #7e1ac7;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tabs button {
            flex: 1;
            background-color: #ddd;
            color: black;
        }

        .tabs button.active {
            background-color: #6a00a8;
            color: white;
        }

        .resultado {
            margin-top: 15px;
            background: #f0e6ff;
            padding: 15px;
            border-radius: 8px;
        }

        .carimbo {
            border-left: 5px solid #6a00a8;
            padding-left: 10px;
        }
    </style>

</head>

<body>

<header>
    BUSCA - CONTATOS EDUCAÇÃO - PROJETO FUST
</header>

<div class="container">
    <div class="box">

        <!-- BOTÕES -->
        <div class="tabs">
            <button id="btnMun" class="active" onclick="mostrarAba('mun')">Município</button>
            <button id="btnInep" onclick="mostrarAba('inep')">INEP</button>
        </div>

        <!-- ABA MUNICIPIO -->
        <div id="abaMunicipio">

            <h3>Buscar por Município</h3>

            <select id="municipio">
                <option>Carregando municípios...</option>
            </select>

            <button onclick="buscarMunicipio()">Buscar</button>

            <div id="resMun" class="resultado"></div>
        </div>

        <!-- ABA INEP -->
        <div id="abaINEP" style="display:none;">

            <h3>Buscar por INEP</h3>

            <input id="inep" placeholder="Digite o código INEP">

            <button onclick="buscarINEP()">Buscar</button>

            <div id="resINEP" class="resultado"></div>
        </div>

    </div>
</div>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- Seu JS -->
<script src="./script.js"></script>

</body>
</html>
