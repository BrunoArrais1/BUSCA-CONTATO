<!DOCTYPE html>
<html>
<head>
    <title>Busca Contato Escolas</title>
</head>
<body>

<h2>BUSCA CONTATO - ESCOLAS PROJETO FUST</h2>

<button onclick="mostrarAba('mun')">Por Município</button>
<button onclick="mostrarAba('inep')">Por INEP</button>

<!-- ========================= -->
<!-- ABA MUNICIPIO -->
<!-- ========================= -->
<div id="abaMunicipio">

    <h3>Buscar por Município</h3>

    <select id="municipio">
        <option>Carregando municípios...</option>
    </select>

    <button onclick="buscarMunicipio()">Buscar</button>

    <div id="resMun"></div>
</div>

<!-- ========================= -->
<!-- ABA INEP -->
<!-- ========================= -->
<div id="abaINEP" style="display:none;">

    <h3>Buscar por INEP</h3>

    <input id="inep" placeholder="Digite INEP">

    <button onclick="buscarINEP()">Buscar</button>

    <div id="resINEP"></div>
</div>

<!-- ✅ Biblioteca Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- ✅ Seu script -->
<script src="./script.js"></script>

</body>
</html>
